<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A bouquet for you ♥</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#24152d,#090912 68%);color:#f8ddeb;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
main{text-align:center;width:min(100%,900px);padding:24px}
h1{font-size:clamp(20px,4vw,30px);font-weight:500;letter-spacing:.08em;margin:0 0 10px}
p{color:#bda9c5;font-size:12px;margin:0 0 18px}
canvas{width:100%;height:min(68vh,620px);display:block}
footer{font-size:clamp(17px,3vw,24px);color:#ffc5e1;text-shadow:0 0 18px #ff6eb5}
button{margin-top:16px;background:#291b31;border:1px solid #8e557c;color:#ffd8eb;padding:9px 16px;border-radius:22px;font:inherit;cursor:pointer}
</style>
</head>
<body><main>
<h1>A LITTLE BOUQUET FOR YOU</h1>
<p>made with a little bit of code and a lot of affection</p>
<canvas id="scene" aria-label="Animated ASCII flower bouquet"></canvas>
<footer id="message">for you ♥</footer>
<button id="pause">Pause animation</button>
</main>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const chars=' .,:;!+*#%@';
let w,h,paused=false,angle=0,last=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);
const flowers=[];
const colors=['#ffd6ed','#ff9fcf','#e879b5','#c5a3ff','#ffe39a','#ffb78d','#f8f4ff','#f5a0b5','#d6b5ff','#fff0b7'];
for(let i=0;i<11;i++){let a=i*2.399,rad=.12+Math.sqrt(i/11)*.24;flowers.push({x:Math.cos(a)*rad,y:-.23-Math.sin(a)*rad*.55,z:Math.sin(a)*rad, color:colors[i%colors.length], petals:5+(i%4), size: .065+(i%3)*.008, phase:i*1.7})}
function project(x,y,z,a){let X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a),Y=y;let f=1.7/(1.7-Z*.48);return [w/2+X*f*w*.56,h*.49-Y*f*h*.56,Z]}
function draw(t){
 if(!paused)angle=t*.00045;
 ctx.clearRect(0,0,w,h);
 const scale=Math.min(w/82,h/34),cols=Math.floor(w/scale),rows=Math.floor(h/scale);
 ctx.font=`${Math.max(7,scale*.92)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 // floating hearts and sparkles
 for(let i=0;i<22;i++){let x=(i*73+Math.sin(t*.0007+i)*18)%w,y=(h-((t*.025+i*47)%(h+40)));ctx.fillStyle=`rgba(255,150,210,${.35+.4*Math.sin(t*.003+i)})`;ctx.fillText(i%3?'·':'♥',x,y)}
 // stems
 flowers.forEach((f,i)=>{let [x,y]=project(f.x,f.y+.45,f.z,angle);let [bx,by]=project(0,.32,0,angle);ctx.strokeStyle='#75a987';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+bx)/2+Math.sin(i)*8,(y+by)/2,x*.92+bx*.08,by);ctx.stroke()});
 // bouquet wrap
 ctx.fillStyle='rgba(235,210,229,.13)';ctx.strokeStyle='rgba(255,220,245,.5)';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(w*.29,h*.60);ctx.quadraticCurveTo(w*.5,h*.72,w*.71,h*.60);ctx.lineTo(w*.59,h*.94);ctx.quadraticCurveTo(w*.5,h*.98,w*.41,h*.94);ctx.closePath();ctx.fill();ctx.stroke();
 // ribbon
 ctx.strokeStyle='#e9a7ce';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(w*.43,h*.78);ctx.quadraticCurveTo(w*.34,h*.73,w*.38,h*.83);ctx.quadraticCurveTo(w*.43,h*.87,w*.49,h*.80);ctx.moveTo(w*.51,h*.80);ctx.quadraticCurveTo(w*.63,h*.72,w*.62,h*.83);ctx.quadraticCurveTo(w*.57,h*.87,w*.51,h*.80);ctx.stroke();
 // flowers sorted back to front
 [...flowers].sort((a,b)=>{let za=a.x*Math.sin(angle)+a.z*Math.cos(angle),zb=b.x*Math.sin(angle)+b.z*Math.cos(angle);return za-zb}).forEach((f,i)=>{
 let [x,y,z]=project(f.x,f.y,f.z,angle),r=f.size*Math.min(w,h)*1.7;
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.0005+f.phase)*.08);
 for(let p=0;p<f.petals;p++){ctx.save();ctx.rotate(p*Math.PI*2/f.petals);ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(0,-r*.52,r*.28,r*.57,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 ctx.shadowBlur=8;ctx.fillStyle=i%3===0?'#f7d778':'#e9bd65';ctx.beginPath();ctx.arc(0,0,r*.23,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff4c4';ctx.font=`${Math.max(8,r*.45)}px monospace`;ctx.fillText('·',-r*.04,r*.02);ctx.restore();
 });
 // baby breath dots
 for(let i=0;i<55;i++){let a=i*2.4,rr=.27+(i%7)*.025,[x,y]=project(Math.cos(a)*rr,-.18-Math.sin(i*1.3)*.25,Math.sin(a)*rr,angle);ctx.fillStyle='#fff4fa';ctx.fillText(i%4?'·':'✧',x,y)}
}
function loop(t){draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play animation':'Pause animation'};
</script></body></html>
